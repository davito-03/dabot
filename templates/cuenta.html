<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="title.account">Cuenta — Dabot</title>
    <link rel="icon" href="https://davito.es/media/dabot.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=5.7">
    <style>
        .music-panel {
            margin: 28px 0 36px;
            padding: 24px;
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(17, 26, 51, 0.88) 0%, rgba(9, 14, 30, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.6);
        }
        .music-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .music-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-bright, #fff);
        }
        .music-header-title i.fa-spotify {
            color: #1DB954;
            font-size: 1.4rem;
        }
        .music-user-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .music-user-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-muted, #94a3b8);
        }
        .music-user-badge a {
            color: #ff6b6b;
            font-weight: 700;
            text-decoration: none;
        }
        .music-user-badge a:hover {
            text-decoration: underline;
        }
        .player-card {
            display: flex;
            align-items: center;
            gap: 24px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        @media (max-width: 640px) {
            .player-card {
                flex-direction: column;
                text-align: center;
            }
        }
        .player-cover-wrapper {
            position: relative;
            flex-shrink: 0;
        }
        .player-cover {
            width: 110px;
            height: 110px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: block;
        }
        .equalizer {
            position: absolute;
            bottom: 8px;
            right: 8px;
            display: flex;
            align-items: flex-end;
            gap: 3px;
            background: rgba(0, 0, 0, 0.75);
            padding: 4px 6px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }
        .equalizer span {
            width: 3px;
            background: #1DB954;
            border-radius: 2px;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .equalizer span:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .equalizer span:nth-child(2) { height: 16px; animation-delay: 0.3s; }
        .equalizer span:nth-child(3) { height: 12px; animation-delay: 0.2s; }
        .equalizer span:nth-child(4) { height: 18px; animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1); }
        }
        .player-details {
            flex-grow: 1;
            min-width: 0;
        }
        .player-status-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .status-live {
            background: rgba(29, 185, 84, 0.15);
            color: #1DB954;
            border: 1px solid rgba(29, 185, 84, 0.3);
        }
        .status-live::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #1DB954;
            box-shadow: 0 0 8px #1DB954;
            animation: pulse-dot 1.5s infinite;
        }
        @keyframes pulse-dot {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        .status-recent {
            background: rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .player-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            margin: 0 0 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-title a {
            color: inherit;
            text-decoration: none;
        }
        .player-title a:hover {
            color: #1DB954;
        }
        .player-artist {
            font-size: 1rem;
            font-weight: 600;
            color: #cbd5e1;
            margin: 0 0 4px 0;
        }
        .player-album {
            font-size: 0.88rem;
            color: #64748b;
            margin: 0 0 10px 0;
        }
        .player-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: #94a3b8;
            flex-wrap: wrap;
        }
        @media (max-width: 640px) {
            .player-stats {
                justify-content: center;
            }
        }
        .player-stats span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .player-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        @media (max-width: 640px) {
            .player-actions {
                justify-content: center;
                width: 100%;
                margin-top: 12px;
            }
        }
        .btn-spotify {
            background: #1DB954;
            color: #000 !important;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            transition: transform .2s, box-shadow .2s;
            font-size: 13px;
        }
        .btn-spotify:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -4px rgba(29, 185, 84, 0.5);
            color: #000 !important;
        }
        .btn-lastfm {
            background: rgba(186, 0, 0, 0.18);
            border: 1px solid rgba(186, 0, 0, 0.4);
            color: #ff6b6b !important;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            transition: transform .2s, background .2s;
            font-size: 13px;
        }
        .btn-lastfm:hover {
            background: rgba(186, 0, 0, 0.3);
            color: #ff8585 !important;
            transform: translateY(-2px);
        }
        .music-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .music-grid {
                grid-template-columns: 1fr;
            }
        }
        .mini-top-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
        }
        .mini-top-card h4 {
            margin: 0 0 12px 0;
            font-size: 0.95rem;
            color: #94a3b8;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mini-top-card h4 i {
            color: #38bdf8;
        }
        .mini-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .mini-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #cbd5e1;
            padding: 6px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            transition: background .2s;
        }
        .mini-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .mini-rank {
            font-weight: 800;
            color: #64748b;
            width: 18px;
            text-align: center;
            font-size: 12px;
        }
        .mini-img {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .mini-info {
            flex-grow: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .mini-name {
            font-weight: 600;
            color: #f1f5f9;
        }
        .mini-name a {
            color: inherit;
            text-decoration: none;
        }
        .mini-name a:hover {
            text-decoration: underline;
        }
        .mini-sub {
            font-size: 11px;
            color: #64748b;
        }
        .mini-count {
            font-size: 11.5px;
            color: #94a3b8;
            font-weight: 600;
            flex-shrink: 0;
        }
        .connect-box {
            text-align: center;
            padding: 24px 16px;
            max-width: 580px;
            margin: 0 auto;
        }
        .connect-box i.fa-brands {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        .connect-box h3 {
            margin: 8px 0 6px;
            font-size: 1.35rem;
            color: #fff;
        }
        .connect-box p {
            color: #94a3b8;
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .connect-form {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .connect-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            min-width: 240px;
            outline: none;
            transition: border-color .2s;
        }
        .connect-input:focus {
            border-color: #1DB954;
        }
        .connect-hint {
            margin-top: 14px;
            font-size: 12px;
            color: #64748b;
        }
        .connect-hint a {
            color: #38bdf8;
            text-decoration: none;
        }
        .connect-hint a:hover {
            text-decoration: underline;
        }
        .music-msg {
            margin-top: 12px;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 8px;
            display: none;
        }
        .music-msg.err {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }
        .music-msg.ok {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            display: block;
        }
    </style>
</head>
<body>
    <div class="ambient"></div>
    <div class="shell">
        <header class="topnav">
            <a class="brand" href="/"><img src="/static/img/dabot.png" alt=""> Dabot</a>
            <nav class="topnav-links">
                <a href="/dashboard" data-i18n="nav.panel">Panel</a>
                <a href="/logout" data-i18n="nav.logout">Salir</a>
                <div class="lang-switch" role="group" aria-label="Language"><select data-lang-select><option value="es">ES</option><option value="en">EN</option><option value="fr">FR</option><option value="de">DE</option><option value="pt">PT</option><option value="it">IT</option><option value="ja">JA</option><option value="ko">KO</option><option value="zh">ZH</option></select></div>
            </nav>
        </header>
        <main class="section">
            <p class="kicker" data-i18n="ac.kicker">Tu espacio</p>
            <h1 class="h-title" id="hello">Tu cuenta</h1>
            <p class="sub" data-i18n="ac.sub">Progreso y sanciones en los servidores donde está Dabot.</p>

            <!-- MUSIC SECTION (LAST.FM & SPOTIFY) -->
            <section class="music-panel glass" id="music-section">
                <div class="empty" style="padding: 20px;"><i class="fa-solid fa-spinner fa-spin"></i> Cargando música...</div>
            </section>

            <h2 style="font-size: 1.4rem; font-weight: 800; margin: 36px 0 16px; color: var(--text-bright);">Servidores vinculados</h2>
            <div class="cards" id="cards"><div class="empty">Cargando…</div></div>
        </main>
    </div>

    <script>
        // Automatic CSRF token handler for mutating requests
        (() => {
            const originalFetch = window.fetch.bind(window);
            const cookie = (name) => document.cookie.split(";").map(v => v.trim()).find(v => v.startsWith(`${name}=`))?.slice(name.length + 1) || "";
            window.fetch = (input, init = {}) => {
                const method = String(init.method || (input && input.method) || "GET").toUpperCase();
                if (["POST", "PUT", "PATCH", "DELETE"].includes(method)) {
                    const headers = new Headers(init.headers || {});
                    const token = cookie("csrf_token");
                    if (token) headers.set("X-CSRF-Token", token);
                    init = { ...init, headers };
                }
                return originalFetch(input, init);
            };
        })();

        // Profile & Guilds loader
        fetch('/api/me/profile').then(async r => {
            if (r.status === 401) { location.href = '/login'; return; }
            const d = await r.json();
            document.getElementById('hello').textContent = d.username;
            const glob = document.createElement('p');
            glob.className = 'sub';
            glob.textContent = (window.DabotI18n && window.DabotI18n.t) ? t('ac.global', { level: d.global_level || 1, xp: d.global_xp || 0 }) : `Nivel global ${d.global_level || 1} · ${d.global_xp || 0} XP`;
            document.getElementById('hello').after(glob);
            const box = document.getElementById('cards');
            if (!d.guilds.length) { box.innerHTML = '<div class="empty">' + ((window.DabotI18n && window.DabotI18n.t) ? t('ac.empty') : 'Sin servidores') + '</div>'; return; }
            box.innerHTML = d.guilds.map(g => {
                const icon = g.icon ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png';
                return `<div class="server-card glass">
                    <img src="${icon}" alt="">
                    <h3>${g.name}</h3>
                    <div>${(window.DabotI18n && window.DabotI18n.t) ? t('lv.level') : 'Nivel'} ${g.level} · ${g.xp} XP</div>
                    <div class="pill">${(window.DabotI18n && window.DabotI18n.t) ? t('ac.infra', { n: g.infractions }) : `${g.infractions} infracciones`}</div>
                    <a class="btn btn-ghost btn-sm" href="/dashboard">${(window.DabotI18n && window.DabotI18n.t) ? t('ac.open') : 'Abrir'}</a>
                </div>`;
            }).join('');
        });

        // Last.fm / Spotify System
        let musicPollInterval = null;

        async function loadMusicSection() {
            const container = document.getElementById('music-section');
            try {
                const res = await fetch('/api/me/lastfm');
                if (res.status === 401) return;
                const data = await res.json();

                if (!data.linked) {
                    renderUnlinkedMusic(container);
                } else {
                    renderLinkedMusic(container, data);
                    loadNowPlaying();
                    loadTopMusic();
                    if (!musicPollInterval) {
                        musicPollInterval = setInterval(loadNowPlaying, 15000);
                    }
                }
            } catch (err) {
                console.error("Error loading music:", err);
                container.innerHTML = '<div class="empty" style="color: #ef4444;">Error al cargar datos de música</div>';
            }
        }

        function renderUnlinkedMusic(container) {
            if (musicPollInterval) { clearInterval(musicPollInterval); musicPollInterval = null; }
            container.innerHTML = `
                <div class="connect-box">
                    <div style="display: flex; justify-content: center; gap: 16px; margin-bottom: 12px;">
                        <i class="fa-brands fa-spotify" style="color: #1DB954; font-size: 2.2rem;"></i>
                        <i class="fa-brands fa-lastfm" style="color: #ba0000; font-size: 2.2rem;"></i>
                    </div>
                    <h3>Conectar Spotify & Last.fm</h3>
                    <p>Vincula tu usuario de Last.fm para ver en tiempo real lo que escuchas en Spotify o Apple Music, tus scrobbles, top artistas y gráficos visuales con los comandos <strong>/fm</strong> y <strong>/np</strong> en Discord.</p>
                    <form class="connect-form" onsubmit="linkLastFm(event)">
                        <input type="text" id="lastfm-username-input" class="connect-input" placeholder="Tu usuario de Last.fm (ej: davito_03)" required autocomplete="off">
                        <button type="submit" class="btn btn-primary" id="btn-link-lastfm">
                            <i class="fa-solid fa-link"></i> Vincular cuenta
                        </button>
                    </form>
                    <div id="connect-feedback" class="music-msg"></div>
                    <div class="connect-hint">
                        ¿No tienes cuenta? <a href="https://www.last.fm/join" target="_blank" rel="noopener">Crea una cuenta gratis en Last.fm</a> y conecta tu Spotify en tu configuración.
                    </div>
                </div>
            `;
        }

        async function linkLastFm(e) {
            e.preventDefault();
            const input = document.getElementById('lastfm-username-input');
            const btn = document.getElementById('btn-link-lastfm');
            const fb = document.getElementById('connect-feedback');
            const username = input.value.trim();
            if (!username) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Vinculando...';
            fb.className = 'music-msg';
            fb.textContent = '';

            try {
                const res = await fetch('/api/me/lastfm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const result = await res.json();
                if (res.ok) {
                    fb.className = 'music-msg ok';
                    fb.textContent = '¡Cuenta vinculada correctamente!';
                    setTimeout(loadMusicSection, 800);
                } else {
                    fb.className = 'music-msg err';
                    fb.textContent = result.detail || 'Error al vincular cuenta';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-link"></i> Vincular cuenta';
                }
            } catch (err) {
                fb.className = 'music-msg err';
                fb.textContent = 'Error de conexión con el servidor';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-link"></i> Vincular cuenta';
            }
        }

        async function unlinkLastFm() {
            if (!confirm('¿Deseas desvincular tu cuenta de Last.fm de Dabot?')) return;
            try {
                const res = await fetch('/api/me/lastfm', { method: 'DELETE' });
                if (res.ok) {
                    loadMusicSection();
                } else {
                    alert('Error al desvincular cuenta');
                }
            } catch (err) {
                alert('Error de conexión');
            }
        }

        function renderLinkedMusic(container, data) {
            const p = data.profile || {};
            const scrobblesStr = Number(p.playcount || 0).toLocaleString();
            const avatarUrl = p.avatar || 'https://lastfm.freetls.fastly.net/i/u/avatar170s/818148bf682d429dc215c1705eb27b98.png';
            
            container.innerHTML = `
                <div class="music-header">
                    <div class="music-header-title">
                        <i class="fa-brands fa-spotify"></i>
                        <span>Música & Spotify</span>
                    </div>
                    <div class="music-user-meta">
                        <div class="music-user-badge">
                            <img src="${avatarUrl}" style="width: 22px; height: 22px; border-radius: 50%; object-fit: cover;" alt="">
                            <a href="${p.url || `https://www.last.fm/user/${data.username}`}" target="_blank" rel="noopener">
                                <i class="fa-brands fa-lastfm"></i> ${data.username}
                            </a>
                            <span>·</span>
                            <span><i class="fa-solid fa-headphones"></i> ${scrobblesStr} scrobbles</span>
                        </div>
                        <button class="btn btn-ghost btn-sm" onclick="unlinkLastFm()" title="Desvincular cuenta" style="color: #ef4444;">
                            <i class="fa-solid fa-unlink"></i> Desvincular
                        </button>
                    </div>
                </div>
                <div id="nowplaying-container">
                    <div class="player-card">
                        <div class="empty" style="width: 100%;"><i class="fa-solid fa-spinner fa-spin"></i> Cargando estado de reproducción...</div>
                    </div>
                </div>
                <div class="music-grid" id="top-music-container">
                    <div class="mini-top-card">
                        <h4><i class="fa-solid fa-microphone"></i> Top Artistas</h4>
                        <div class="empty" style="padding: 10px;">Cargando...</div>
                    </div>
                    <div class="mini-top-card">
                        <h4><i class="fa-solid fa-music"></i> Top Canciones</h4>
                        <div class="empty" style="padding: 10px;">Cargando...</div>
                    </div>
                </div>
            `;
        }

        async function loadNowPlaying() {
            const container = document.getElementById('nowplaying-container');
            if (!container) return;
            try {
                const res = await fetch('/api/me/lastfm/nowplaying');
                if (!res.ok) return;
                const d = await res.json();
                if (!d.linked || !d.track) {
                    container.innerHTML = `
                        <div class="player-card" style="justify-content: center; padding: 28px; text-align: center;">
                            <div style="color: #94a3b8;">
                                <i class="fa-solid fa-music" style="font-size: 2rem; margin-bottom: 10px; opacity: 0.5;"></i>
                                <p style="margin: 0;">No hay reproducciones recientes en Last.fm todavía.</p>
                                <span style="font-size: 12px; opacity: 0.7;">¡Reproduce una canción en Spotify para verla aquí y en Discord!</span>
                            </div>
                        </div>
                    `;
                    return;
                }

                const tr = d.track;
                const isLive = !!tr.nowplaying;
                const img = tr.image || 'https://lastfm.freetls.fastly.net/i/u/300x300/2a96cbd8b46e442fc41c2b86b821562f.png';

                container.innerHTML = `
                    <div class="player-card">
                        <div class="player-cover-wrapper">
                            <img class="player-cover" src="${img}" alt="${tr.name}">
                            ${isLive ? `
                                <div class="equalizer" title="Reproduciendo en vivo">
                                    <span></span><span></span><span></span><span></span>
                                </div>
                            ` : ''}
                        </div>
                        <div class="player-details">
                            <div class="player-status-tag ${isLive ? 'status-live' : 'status-recent'}">
                                <i class="fa-solid ${isLive ? 'fa-signal' : 'fa-clock'}"></i>
                                ${isLive ? 'Reproduciendo ahora' : 'Última escuchada'}
                            </div>
                            <h3 class="player-title" title="${tr.name}">
                                <a href="${tr.url || tr.spotify_url}" target="_blank" rel="noopener">${tr.name}</a>
                            </h3>
                            <div class="player-artist">${tr.artist}</div>
                            ${tr.album ? `<div class="player-album"><i class="fa-solid fa-compact-disc"></i> ${tr.album}</div>` : ''}
                            <div class="player-stats">
                                <span><i class="fa-solid fa-play" style="color: #1DB954;"></i> ${tr.user_playcount || 0} reproducciones de este tema</span>
                                <span><i class="fa-solid fa-user"></i> ${tr.user_artist_playcount || 0} del artista</span>
                                ${tr.global_listeners ? `<span><i class="fa-solid fa-users"></i> ${Number(tr.global_listeners).toLocaleString()} oyentes globales</span>` : ''}
                            </div>
                        </div>
                        <div class="player-actions">
                            <a href="${tr.spotify_url}" target="_blank" rel="noopener" class="btn-spotify">
                                <i class="fa-brands fa-spotify"></i> Escuchar en Spotify
                            </a>
                            <a href="${tr.url}" target="_blank" rel="noopener" class="btn-lastfm">
                                <i class="fa-brands fa-lastfm"></i> Last.fm
                            </a>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error("Error loading now playing:", err);
            }
        }

        async function loadTopMusic() {
            const container = document.getElementById('top-music-container');
            if (!container) return;
            try {
                const res = await fetch('/api/me/lastfm/top');
                if (!res.ok) return;
                const d = await res.json();
                
                const artists = d.top_artists || d.artists || [];
                const artistsHtml = artists.length ? artists.slice(0, 5).map((a, i) => `
                    <div class="mini-item">
                        <div class="mini-rank">${i + 1}</div>
                        <div class="mini-info">
                            <div class="mini-name"><a href="${a.url}" target="_blank" rel="noopener">${a.name}</a></div>
                        </div>
                        <div class="mini-count">${Number(a.playcount || 0).toLocaleString()} scrobbles</div>
                    </div>
                `).join('') : '<div class="empty" style="padding: 10px;">Sin datos aún</div>';

                const tracks = d.top_tracks || d.tracks || [];
                const tracksHtml = tracks.length ? tracks.slice(0, 5).map((t, i) => `
                    <div class="mini-item">
                        <div class="mini-rank">${i + 1}</div>
                        ${t.image ? `<img class="mini-img" src="${t.image}" alt="">` : ''}
                        <div class="mini-info">
                            <div class="mini-name"><a href="${t.url}" target="_blank" rel="noopener">${t.name}</a></div>
                            <div class="mini-sub">${t.artist}</div>
                        </div>
                        <div class="mini-count">${Number(t.playcount || 0).toLocaleString()} plays</div>
                    </div>
                `).join('') : '<div class="empty" style="padding: 10px;">Sin datos aún</div>';

                container.innerHTML = `
                    <div class="mini-top-card">
                        <h4><i class="fa-solid fa-microphone"></i> Top Artistas (30 días)</h4>
                        <div class="mini-list">${artistsHtml}</div>
                    </div>
                    <div class="mini-top-card">
                        <h4><i class="fa-solid fa-music"></i> Top Canciones (30 días)</h4>
                        <div class="mini-list">${tracksHtml}</div>
                    </div>
                `;
            } catch (err) {
                console.error("Error loading top music:", err);
            }
        }

        loadMusicSection();
    </script>
    <script src="/static/js/i18n.js?v=5.7"></script>
    <script src="/static/js/cookies.js?v=2"></script>
</body>
</html>
