<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="title.levels">Niveles — Dabot</title>
    <link rel="icon" href="https://davito.es/media/dabot.png">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=5.7">
</head>
<body>
    <div class="ambient"></div>
    <div class="shell">
        <header class="topnav">
            <a class="brand" href="/"><img src="/static/img/dabot.png" alt=""> Dabot</a>
            <nav class="topnav-links">
                <a href="/comunidad" data-i18n="nav.community">Comunidad</a>
                <a class="btn btn-primary btn-sm" href="/login" data-i18n="nav.enter">Entrar</a>
                <div class="lang-switch" role="group" aria-label="Language"><select data-lang-select><option value="es">ES</option><option value="en">EN</option><option value="fr">FR</option><option value="de">DE</option><option value="pt">PT</option><option value="it">IT</option><option value="ja">JA</option><option value="ko">KO</option><option value="zh">ZH</option></select></div>
            </nav>
        </header>
        <main class="section">
            <p class="kicker" data-i18n="lv.kicker">Niveles y experiencia</p>
            <h1 class="h-title" style="font-size:2.4rem" data-i18n="lv.title">Tu progreso cuenta.</h1>
            <p class="sub" data-i18n="lv.sub">Clasificación pública. Entra con Discord para ver la tuya.</p>
            <div class="row" style="max-width:720px;margin-bottom:24px">
                <div class="field">
                    <label data-i18n="lv.view">Vista</label>
                    <select id="scope-select">
                        <option value="guild" data-i18n="lv.guild">Por servidor</option>
                        <option value="global" data-i18n="lv.global">Global (todos los servers de Dabot)</option>
                    </select>
                </div>
                <div class="field" id="guild-wrap">
                    <label data-i18n="lv.server">Servidor</label>
                    <select id="guild-select"></select>
                </div>
            </div>
            <div class="panel glass" id="lb"></div>
            <p class="sub" style="margin-top:24px" data-i18n="lv.note">Texto 15–25 XP / mensaje · Voz 10–20 XP / minuto. Lo configura cada servidor en el panel.</p>
        </main>
    </div>
    <script>
        async function paint(rows, emptyMsg) {
            const box = document.getElementById('lb');
            if (!rows.length) { box.innerHTML = '<div class="empty">' + emptyMsg + '</div>'; return; }
            box.innerHTML = rows.map(r => `<div class="lb-row">
                <div class="rank">#${r.rank}</div>
                <img src="${r.avatar_url || 'https://cdn.discordapp.com/embed/avatars/0.png'}" alt="">
                <div style="flex:1"><b>${r.username || r.user_id}</b><div class="mono">${t('lv.level')} ${r.level}</div></div>
                <div><b>${r.xp}</b> XP</div>
            </div>`).join('');
        }
        async function loadLb() {
            const box = document.getElementById('lb');
            box.innerHTML = t('ru.loading');
            const scope = document.getElementById('scope-select').value;
            document.getElementById('guild-wrap').style.display = scope === 'guild' ? '' : 'none';
            if (scope === 'global') {
                const data = await (await fetch('/api/public/leaderboard-global')).json();
                return paint(data.leaderboard || [], 'Aún no hay XP global.');
            }
            const gid = document.getElementById('guild-select').value;
            if (!gid) { box.innerHTML = '<div class="empty">Elige un servidor.</div>'; return; }
            const data = await (await fetch('/api/public/leaderboard?guild_id=' + gid)).json();
            paint(data.leaderboard || [], 'Aún no hay XP en este servidor.');
        }
        fetch('/api/public/guilds').then(r => r.json()).then(d => {
            const sel = document.getElementById('guild-select');
            (d.guilds || []).forEach(g => {
                const o = document.createElement('option');
                o.value = g.id; o.textContent = g.name + (g.members ? ` · ${g.members}` : '');
                sel.appendChild(o);
            });
            sel.onchange = loadLb;
            document.getElementById('scope-select').onchange = loadLb;
            loadLb();
        });
        document.addEventListener('dabot:lang', loadLb);
    </script>
    <script src="/static/js/i18n.js?v=5.7"></script>
    <script src="/static/js/cookies.js?v=2"></script>
</body>
</html>
