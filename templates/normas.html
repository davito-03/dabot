<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="title.rules">Normas — Dabot</title>
    <link rel="icon" href="https://davito.es/media/dabot.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=5.7">
</head>
<body>
    <div class="ambient"></div>
    <div class="shell">
        <header class="topnav">
            <a class="brand" href="/"><img src="/static/img/dabot.png" alt=""> Dabot</a>
            <nav class="topnav-links">
                <a href="/comunidad" data-i18n="nav.community">Comunidad</a>
                <a href="/cuenta" data-i18n="nav.appeals">Apelaciones</a>
                <a class="btn btn-primary btn-sm" href="/login" data-i18n="nav.enter">Entrar</a>
                <div class="lang-switch" role="group" aria-label="Language"><select data-lang-select><option value="es">ES</option><option value="en">EN</option><option value="fr">FR</option><option value="de">DE</option><option value="pt">PT</option><option value="it">IT</option><option value="ja">JA</option><option value="ko">KO</option><option value="zh">ZH</option></select></div>
            </nav>
        </header>
        <main class="section">
            <p class="kicker" data-i18n="ru.kicker">Convivencia</p>
            <h1 class="h-title" style="font-size:2.4rem" data-i18n="ru.title">Normas.</h1>
            <p class="sub" data-i18n="ru.sub">Publicadas por el staff de cada servidor. Desconocerlas no evita la sanción.</p>
            <div class="field" style="max-width:420px;margin-bottom:24px">
                <label data-i18n="ru.server">Servidor</label>
                <select id="guild-select"></select>
            </div>
            <div class="panel glass rules-body" id="rules">Cargando…</div>
            <p class="sub" style="margin-top:20px"><span data-i18n="ru.appeal">¿Crees que una sanción es injusta?</span> <a href="/cuenta" data-i18n="ru.appeal.link">Centro de apelaciones</a>.</p>
        </main>
    </div>
    <script>
        const def = `Normas básicas
• Respeta a todo el mundo. El acoso se sanciona.
• Nada de spam, flood ni invitaciones a otros servidores.
• El contenido NSFW solo en canales marcados.
• El staff puede actuar aunque un caso no esté escrito aquí.
• Las quejas van por tickets, no por MD al staff.

El equipo configura el texto exacto desde el panel de Dabot → Discord → Normas.`;
        async function load(gid) {
            const box = document.getElementById('rules');
            const data = await (await fetch('/api/public/rules?guild_id=' + gid)).json();
            box.textContent = data.rules && data.rules.trim() ? data.rules : def;
        }
        fetch('/api/public/guilds').then(r => r.json()).then(d => {
            const sel = document.getElementById('guild-select');
            (d.guilds || []).forEach(g => {
                const o = document.createElement('option');
                o.value = g.id; o.textContent = g.name;
                sel.appendChild(o);
            });
            sel.onchange = () => load(sel.value);
            if (sel.value) load(sel.value);
        });
    </script>
    <script src="/static/js/i18n.js?v=5.7"></script>
    <script src="/static/js/cookies.js?v=2"></script>
</body>
</html>
